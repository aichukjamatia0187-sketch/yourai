services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: yourai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yourai
      POSTGRES_PASSWORD: yourai_dev_password
      POSTGRES_DB: yourai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: yourai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
